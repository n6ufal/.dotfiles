"$schema" = 'https://starship.rs/config-schema.json'
add_newline = true
format = """$username$hostname $sudo$directory$fill$git_branch$git_status$cmd_duration$python
$character"""
scan_timeout = 20
command_timeout = 500

[username]
show_always = false
style_user = 'bold yellow'
style_root = 'bold red'
format = '[$user]($style)'

[hostname]
ssh_only = true
style = 'bold green'
format = '@[$hostname]($style)'

[sudo]
disabled = false
style = 'bold red'
symbol = '⬆ '
format = '[$symbol]($style)'

[fill]
symbol = ' '

[character]
success_symbol = '[❯](bold green)'
error_symbol = '[❯](bold red)'
vicmd_symbol = '[❮](bold purple)'

[cmd_duration]
min_time = 2000
format = "[\uf252 $duration]($style)"
style = 'bold purple'

[directory]
style = 'bold blue'
format = "[\uf115 $path]($style)[$read_only]($read_only_style)"
read_only_style = 'bold red'
read_only = "\uf023 "
truncation_length = 3
truncate_to_repo = true
truncation_symbol = '…/'

[git_branch]
format = '[$symbol$branch(:$remote_branch)]($style) '
style = 'bold cyan'
symbol = "\ue0a0 "

[git_status]
format = '[$all_status$ahead_behind]($style)'
style = 'bold cyan'
conflicted = "\uf0e7 "
ahead = '⇡${count} '
behind = '⇣${count} '
diverged = '⇕⇡${ahead_count}⇣${behind_count} '
untracked = "\uf128 "
stashed = "\uf01c "
modified = "\uf044 "
staged = "\uf067 "
renamed = '󰑕 '
deleted = "\uf014 "

[python]
format = '[ $symbol$version]($style)'
symbol = "\ue73c "
style = 'purple'
